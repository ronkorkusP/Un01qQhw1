$kind: http-request
name: Retrieve a vehicle
url: "{{baseUrl}}/vehicles/:id"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: "4"
    description: ""
settings: {}
scripts:
  - type: beforeRequest
    code: |-
      const id = pm.collectionVariables.get("createdVehicleId");
      if (id) pm.request.url.variables.substitute({ id: String(id) });
    language: text/javascript
  - type: afterResponse
    code: pm.test("Status code is 200 OK", () => pm.response.to.have.status(200));
    language: text/javascript
examples: ./.resources/Retrieve a vehicle.resources/examples
order: 2000
