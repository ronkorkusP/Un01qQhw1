$kind: http-request
url: "{{baseUrl}}/vehicles"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "nickName": "The Lisa Marie",
      "vin": "4M2DV11W4RDJ53329",
      "make": "Mercury",
      "model": "Villager",
      "year": "1994",
      "miles": 159864
    }
settings: {}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 201 Created or 409 Conflict", () => pm.expect(pm.response.code).to.be.oneOf([201, 409]));
      const body = pm.response.json();
      if (pm.response.code === 201 && body.id) {
        pm.collectionVariables.set("createdVehicleId", body.id);
      }
examples: ./.resources/Create a vehicle.resources/examples
order: 1000
